<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>דגשים · פרק 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--ink:#16181b;--soft:#6b7078;--line:#e6e8eb;--done:#9aa0a6;--accent:#17808C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,-apple-system,BlinkMacSystemFont,sans-serif;line-height:1.65}
main{max-width:760px;margin:0 auto;padding:40px 16px 80px}
h1{font-size:28px;margin:0 0 4px;font-weight:700}
.meta{color:var(--soft);font-size:15px;margin:0 0 6px}
.count{color:var(--soft);font-size:14px;margin:0 0 26px}
ul{list-style:none;margin:0;padding:0}
li{border-top:1px solid var(--line)}
li:last-child{border-bottom:1px solid var(--line)}
label{display:flex;gap:14px;align-items:flex-start;padding:16px 2px;cursor:pointer;font-size:17px}
input{width:22px;height:22px;margin-top:4px;flex:none;accent-color:var(--accent);cursor:pointer}
input:checked+span{color:var(--done);text-decoration:line-through}
span{unicode-bidi:plaintext}
</style>
</head>
<body>
<main>
<h1>דגשים</h1>
<p class="meta">ניר פורת · 20.10.2026</p>
<p class="count" id="count"></p>
<ul>
<li><label><input type="checkbox" data-id="n1"><span>הייתי מנסה לסדר את זה כך כשמתחילות המילים של השיר, מתחילה החטיפה על המטוס (אפשר לוותר אולי על הקטע שהם יושבים ומסתכלים אחד על השני לפני החטיפה).</span></label></li>
<li><label><input type="checkbox" data-id="n2"><span>להוריד את כל המלל בסרטון (this plane is under attack, time to party) ומשאיר רק את המלל בסוף של האנס עם העז</span></label></li>
<li><label><input type="checkbox" data-id="n3"><span>הקטע עם הדיילים נראה לא מספיק טבעי. הם עומדים שם בלי לזוז. פחות אהבתי. וגם הייתי מאיץ את זה עוד. שכל החטיפה תקרה יותר מהר.</span></label></li>
<li><label><input type="checkbox" data-id="n4"><span>הדיילת שחוטפת את הנקניקיות הייתי עושה שהיא מתפוצצת מזה ולא נופלת אחורה. נראה לי מצחיק יותר שתתפוצץ</span></label></li>
<li><label><input type="checkbox" data-id="n5"><span>הטייסים בקוקפיט זה אותו אדם פעמיים<br>שייראו קצת שונה אחד מהשני</span></label></li>
<li><label><input type="checkbox" data-id="n6"><span>ריצה יותר מהירה עם הרימון מונה לקוקפיט</span></label></li>
<li><label><input type="checkbox" data-id="n7"><span>כל החטיפה לעשות קצת יותר מהיר</span></label></li>
<li><label><input type="checkbox" data-id="n8"><span>את המונה שנפתחת על ידי הנוסע הייתי משנה לבקבוק tuica<br>יש לנו יותר מדי מונה בסרטון. אולי זה משהו שיש לו ולא מתגלגל אליו.</span></label></li>
<li><label><input type="checkbox" data-id="n9"><span>כשהטויקה נפתחת על ידי הנוסע, תראו את כל החוטפים שלנו באותו זמן במסך מפוצל (כל אחד במיקום שלו על המטוס) עם תגובות דומות לזה של הזקנה - החושים שלהם נדלקים כשנפתח הבקבוק</span></label></li>
<li><label><input type="checkbox" data-id="n10"><span>המסך המפוצל ממשיך ורואים את כל הדמויות רצות ממיקום אחר במטוס ונפגשים ליד הנוסע עם הבקבוק<br>שם מסתיים המסך המפוצל והם כולם שם ביחד איתו</span></label></li>
<li><label><input type="checkbox" data-id="n11"><span>ווסיל מרים את הבקבוקי מונות שלו כמו שעשיתם ומתחילה המסיבה במטוס:</span></label></li>
<li><label><input type="checkbox" data-id="n12"><span>אנשים והדמויות שלנו שותים ומשתכרים</span></label></li>
<li><label><input type="checkbox" data-id="n13"><span>זקנה עושה lapdance לנוסע אמריקאי שמן עם חולצת הוואי</span></label></li>
<li><label><input type="checkbox" data-id="n14"><span>ווסיל ויורל עושים ברביקיו על המטוס כמו זה שהיה בסרטון של החייזרים עם עשן במטוס</span></label></li>
<li><label><input type="checkbox" data-id="n15"><span>ונסו לחשוב על עוד דברים מצחיקים ולא קשורים למטוס🤣</span></label></li>
<li><label><input type="checkbox" data-id="n16"><span>החזיר טייס מעולף במסיבה עם בקבוקי אלכוהול סביבו במסיבה וככה למעשה המטוס צולל ומתרסק</span></label></li>
<li><label><input type="checkbox" data-id="n17"><span>בואו ננסה שכל הסרטון יהיה דקה וחצי<br>שתי דקות יהיה לי כבר יקר מדי🤣</span></label></li>
<li><label><input type="checkbox" data-id="n18"><span>על המטוס אולי יהיה כתוב<br>Escape from vaslui בצבעים שלנו<br>במקום American Airlines</span></label></li>
</ul>
</main>
<script>
const KEY="vaslui-ep07-nir-notes-2026-10-20";
let state={}; try{state=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const boxes=[...document.querySelectorAll("input[type=checkbox]")];
function count(){const d=boxes.filter(b=>b.checked).length;document.getElementById("count").textContent=d+" מתוך "+boxes.length;}
boxes.forEach(b=>{b.checked=!!state[b.dataset.id];b.addEventListener("change",()=>{state[b.dataset.id]=b.checked;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){};count();});});
count();
</script>
</body>
</html>
