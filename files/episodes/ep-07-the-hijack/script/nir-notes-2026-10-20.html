<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>דגשים · פרק 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--ink:#16181b;--soft:#6b7078;--line:#e6e8eb;--done:#9aa0a6;--accent:#17808C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,-apple-system,BlinkMacSystemFont,sans-serif;line-height:1.65}
main{max-width:760px;margin:0 auto;padding:40px 16px 80px}
h1{font-size:28px;margin:0 0 4px;font-weight:700}
.meta{color:var(--soft);font-size:15px;margin:0 0 6px}
.count{color:var(--soft);font-size:14px;margin:0 0 26px}
ul{list-style:none;margin:0;padding:0}
li{border-top:1px solid var(--line)}
li:last-child{border-bottom:1px solid var(--line)}
label{display:flex;gap:14px;align-items:flex-start;padding:16px 2px;cursor:pointer;font-size:17px}
input{width:22px;height:22px;margin-top:4px;flex:none;accent-color:var(--accent);cursor:pointer}
input:checked+span.txt{color:var(--done);text-decoration:line-through}
span.txt{unicode-bidi:plaintext;flex:1}
h2{font-size:19px;margin:34px 0 10px;font-weight:700}
.who{flex:none;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;margin-top:3px;white-space:nowrap}
.who.avihai{background:#e8f4f5;color:#0f5f68}.who.aviv{background:#fdeee6;color:#9a3d12}
.legend{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--soft);margin:0 0 4px}
</style>
</head>
<body>
<main>
<h1>דגשים</h1>
<p class="meta">ניר פורת · 20.10.2026</p>
<p class="count" id="count"></p>
<p class="legend"><span class="who avihai">אביחי</span><span class="who aviv">אביב</span></p>
<h2>תיקונים — מה שכבר עשינו (עד שכולם רצים לבקבוק)</h2>
<ul>
<li><label><input type="checkbox" data-id="n1"><span class="txt">הייתי מנסה לסדר את זה כך כשמתחילות המילים של השיר, מתחילה החטיפה על המטוס (אפשר לוותר אולי על הקטע שהם יושבים ומסתכלים אחד על השני לפני החטיפה).</span><span class="who avihai">אביחי</span></label></li>
<li><label><input type="checkbox" data-id="n2"><span class="txt">להוריד את כל המלל בסרטון (this plane is under attack, time to party) ומשאיר רק את המלל בסוף של האנס עם העז</span><span class="who avihai">אביחי</span></label></li>
<li><label><input type="checkbox" data-id="n3"><span class="txt">הקטע עם הדיילים נראה לא מספיק טבעי. הם עומדים שם בלי לזוז. פחות אהבתי. וגם הייתי מאיץ את זה עוד. שכל החטיפה תקרה יותר מהר.</span><span class="who avihai">אביחי</span></label></li>
<li><label><input type="checkbox" data-id="n4"><span class="txt">הדיילת שחוטפת את הנקניקיות הייתי עושה שהיא מתפוצצת מזה ולא נופלת אחורה. נראה לי מצחיק יותר שתתפוצץ</span><span class="who avihai">אביחי</span></label></li>
<li><label><input type="checkbox" data-id="n5"><span class="txt">הטייסים בקוקפיט זה אותו אדם פעמיים<br>שייראו קצת שונה אחד מהשני</span><span class="who avihai">אביחי</span></label></li>
<li><label><input type="checkbox" data-id="n6"><span class="txt">ריצה יותר מהירה עם הרימון מונה לקוקפיט</span><span class="who avihai">אביחי</span></label></li>
<li><label><input type="checkbox" data-id="n7"><span class="txt">כל החטיפה לעשות קצת יותר מהיר</span><span class="who avihai">אביחי</span></label></li>
<li><label><input type="checkbox" data-id="n8"><span class="txt">את המונה שנפתחת על ידי הנוסע הייתי משנה לבקבוק tuica<br>יש לנו יותר מדי מונה בסרטון. אולי זה משהו שיש לו ולא מתגלגל אליו.</span><span class="who avihai">אביחי</span></label></li>
<li><label><input type="checkbox" data-id="n9"><span class="txt">כשהטויקה נפתחת על ידי הנוסע, תראו את כל החוטפים שלנו באותו זמן במסך מפוצל (כל אחד במיקום שלו על המטוס) עם תגובות דומות לזה של הזקנה - החושים שלהם נדלקים כשנפתח הבקבוק</span><span class="who avihai">אביחי</span></label></li>
<li><label><input type="checkbox" data-id="n10"><span class="txt">המסך המפוצל ממשיך ורואים את כל הדמויות רצות ממיקום אחר במטוס ונפגשים ליד הנוסע עם הבקבוק<br>שם מסתיים המסך המפוצל והם כולם שם ביחד איתו</span><span class="who aviv">אביב</span></label></li>
<li><label><input type="checkbox" data-id="a1"><span class="txt">הקטע עם הכפכף — לעשות שוב</span><span class="who aviv">אביב</span></label></li>
<li><label><input type="checkbox" data-id="n18"><span class="txt">על המטוס אולי יהיה כתוב<br>Escape from vaslui בצבעים שלנו<br>במקום American Airlines</span><span class="who avihai">אביחי</span></label></li>
</ul>
<h2>עוד לא בוצע — מהמסיבה והלאה</h2>
<ul>
<li><label><input type="checkbox" data-id="n11"><span class="txt">ווסיל מרים את הבקבוקי מונות שלו כמו שעשיתם ומתחילה המסיבה במטוס:</span><span class="who avihai">אביחי</span></label></li>
<li><label><input type="checkbox" data-id="n12"><span class="txt">אנשים והדמויות שלנו שותים ומשתכרים</span><span class="who avihai">אביחי</span></label></li>
<li><label><input type="checkbox" data-id="n13"><span class="txt">זקנה עושה lapdance לנוסע אמריקאי שמן עם חולצת הוואי</span><span class="who avihai">אביחי</span></label></li>
<li><label><input type="checkbox" data-id="n14"><span class="txt">ווסיל ויורל עושים ברביקיו על המטוס כמו זה שהיה בסרטון של החייזרים עם עשן במטוס</span><span class="who avihai">אביחי</span></label></li>
<li><label><input type="checkbox" data-id="n15"><span class="txt">ונסו לחשוב על עוד דברים מצחיקים ולא קשורים למטוס🤣</span><span class="who avihai">אביחי</span></label></li>
<li><label><input type="checkbox" data-id="n16"><span class="txt">החזיר טייס מעולף במסיבה עם בקבוקי אלכוהול סביבו במסיבה וככה למעשה המטוס צולל ומתרסק</span><span class="who avihai">אביחי</span></label></li>
</ul>
<h2>כללי</h2>
<ul>
<li><label><input type="checkbox" data-id="n17"><span class="txt">בואו ננסה שכל הסרטון יהיה דקה וחצי<br>שתי דקות יהיה לי כבר יקר מדי🤣</span><span class="who avihai">אביחי</span></label></li>
</ul>
</main>
<script>
const KEY="vaslui-ep07-nir-notes-2026-10-20";
let state={}; try{state=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const boxes=[...document.querySelectorAll("input[type=checkbox]")];
function count(){const d=boxes.filter(b=>b.checked).length;document.getElementById("count").textContent=d+" מתוך "+boxes.length;}
boxes.forEach(b=>{b.checked=!!state[b.dataset.id];b.addEventListener("change",()=>{state[b.dataset.id]=b.checked;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){};count();});});
count();
</script>
</body>
</html>
